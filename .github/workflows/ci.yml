name: Static Site CI
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check entry point
        shell: bash
        run: test -f index.html
      - name: Parse HTML
        shell: python
        run: |
          import html.parser
          from pathlib import Path
          p=html.parser.HTMLParser()
          p.feed(Path("index.html").read_text(encoding="utf-8"))
          p.close()
          print("index.html parsed successfully")
